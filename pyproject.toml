[project]
name = "storyforge"
version = "0.1.0"
description = "Diagnose a deck's story, write the pyramid contract, render and gate the slides, or hand off a build package."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "python-pptx>=1.0", "openpyxl>=3.1", "playwright>=1.40", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
